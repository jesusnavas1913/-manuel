<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I.E. Guaimaral · Comunicado</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07111e;
      --card-bg: rgba(13, 27, 46, 0.92);
      --border: rgba(245, 158, 11, 0.5);
      --amber: #f59e0b;
      --amber-light: #fde047;
      --text: #ffffff;
      --text-soft: #e2e8f0;
    }

    html, body {
      min-height: 100vh;
      margin: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 20%, #0d233e 0%, var(--bg) 80%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    /* Partículas de fondo */
    #bgCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Contenedor central */
    .message-container {
      position: relative;
      z-index: 10;
      max-width: 900px;
      width: 100%;
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 36px;
      padding: 60px 48px;
      text-align: center;
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.65),
        0 0 50px rgba(245, 158, 11, 0.2);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: popIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.94) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Escudo */
    .shield-box {
      margin-bottom: 24px;
    }

    .shield-box img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(245, 158, 11, 0.45));
    }

    .school-label {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--amber-light);
      margin-bottom: 8px;
    }

    /* Título principal en GRANDE */
    .title-large {
      font-size: 46px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -1px;
      color: #ffffff;
      margin-bottom: 28px;
    }

    .title-large span {
      color: var(--amber-light);
    }

    /* Mensaje central en GRANDE */
    .text-body-large {
      font-size: 26px;
      font-weight: 600;
      line-height: 1.5;
      color: var(--text-soft);
      margin-bottom: 32px;
      max-width: 780px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Tarjeta destacada de la tarde */
    .alert-banner {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.25), rgba(217, 119, 6, 0.15));
      border: 2px solid var(--amber);
      border-radius: 24px;
      padding: 28px 32px;
      margin: 32px auto;
      max-width: 780px;
      box-shadow: 0 10px 30px rgba(245, 158, 11, 0.2);
    }

    .alert-banner-text {
      font-size: 30px;
      font-weight: 900;
      line-height: 1.35;
      color: #fef08a;
    }

    /* Agradecimiento final en GRANDE */
    .text-thanks {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      margin-top: 24px;
    }

    .text-thanks span {
      color: var(--amber-light);
    }

    /* Responsive para celulares */
    @media (max-width: 768px) {
      .message-container {
        padding: 40px 24px;
        border-radius: 28px;
      }
      .shield-box img {
        width: 85px;
        height: 85px;
      }
      .title-large {
        font-size: 32px;
      }
      .text-body-large {
        font-size: 20px;
      }
      .alert-banner {
        padding: 20px;
      }
      .alert-banner-text {
        font-size: 22px;
      }
      .text-thanks {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <main class="message-container">
    
    <!-- Escudo Institucional -->
    <div class="shield-box">
      <img src="assets/img/escudo.png" alt="Escudo Institución Educativa Guaimaral">
    </div>

    <div class="school-label">Institución Educativa Guaimaral</div>

    <!-- Título en grande -->
    <h1 class="title-large">
      📢 ¡Estimados <span>Profesores</span>!
    </h1>

    <!-- Mensaje claro y en grande -->
    <p class="text-body-large">
      Les ofrecemos una sincera disculpa. Tuvimos un error técnico temporal en la plataforma y nos encontramos trabajando en su solución.
    </p>

    <!-- Aviso clave resaltado en grande -->
    <div class="alert-banner">
      <div class="alert-banner-text">
        ⏰ Ya en la tarde queda activada la plataforma.
      </div>
    </div>

    <!-- Agradecimiento -->
    <p class="text-thanks">
      🤝 ¡Muchas gracias por su <span>comprensión y paciencia</span>!
    </p>

  </main>

  <!-- Partículas doradas de fondo -->
  <script>
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let W, H, pts = [];

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      pts = Array.from({ length: 50 }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.35,
        vy: (Math.random() - 0.5) * 0.35,
        r: Math.random() * 2 + 0.5,
        a: Math.random() * 0.4 + 0.15
      }));
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      pts.forEach(p => {
        p.x = (p.x + p.vx + W) % W;
        p.y = (p.y + p.vy + H) % H;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(245, 158, 11, ${p.a})`;
        ctx.fill();
      });
      for (let i = 0; i < pts.length; i++) {
        for (let j = i + 1; j < pts.length; j++) {
          const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
          const d = Math.sqrt(dx*dx + dy*dy);
          if (d < 110) {
            ctx.beginPath();
            ctx.moveTo(pts[i].x, pts[i].y);
            ctx.lineTo(pts[j].x, pts[j].y);
            ctx.strokeStyle = `rgba(245, 158, 11, ${(1 - d/110) * 0.15})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    draw();
  </script>
</body>
</html>
